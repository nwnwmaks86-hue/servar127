name: Windows RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $password
          }

          Add-LocalGroupMember -Group "Administrators" -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" `
            -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest $url -OutFile $file

          Start-Process msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait

          Remove-Item $file -Force

      - name: Start Tailscale Service
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Start-Service Tailscale

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $job = Start-Job -ScriptBlock {
            param($exe, $key, $hostname)
            & $exe up "--auth-key=$key" "--hostname=$hostname"
          } -ArgumentList $exe, $env:TS_AUTH_KEY, "gh-runner-$env:GITHUB_RUN_ID"

          $result = Wait-Job $job -Timeout 60

          if (-not $result) {
            Stop-Job $job
            throw "Tailscale connection timed out."
          }

          Receive-Job $job
          Remove-Job $job

          $ip = & $exe ip -4

          if (-not $ip) {
            throw "Tailscale IP not assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          Write-Host "RDP connectivity: $($result.TcpTestSucceeded)"

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write
